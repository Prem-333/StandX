# nginx TLS reverse proxy for StandX production deployment.
# Place your TLS certificate at /etc/ssl/standx/cert.pem
# and private key at /etc/ssl/standx/key.pem before starting.
#
# This config enforces:
#   - TLS 1.2+ only (TLS 1.0/1.1 disabled)
#   - HTTP → HTTPS redirect
#   - HSTS with 1-year max-age
#   - Strict request body size limit (6 MiB, matching API 5 MiB + headers)
#   - Rate limiting at the nginx layer (60 req/min per IP, burst 10)
#   - No server version disclosure

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide nginx version from error pages and Server header.
    server_tokens off;

    # Structured access log.
    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"duration":$request_time,'
        '"upstream_time":"$upstream_response_time"}';
    access_log /var/log/nginx/access.log json_combined;

    # Rate limit zone: 60 req/min per IP, burst 10 with nodelay.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_status 429;

    # HTTP → HTTPS redirect.
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS API server.
    server {
        listen 443 ssl;
        server_name standx.internal;    # Replace with your FQDN

        ssl_certificate     /etc/ssl/standx/cert.pem;
        ssl_certificate_key /etc/ssl/standx/key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'none'" always;

        # Upload size limit (5 MiB document + headers).
        client_max_body_size 6m;

        location /v1/ {
            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass         http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 120s;
            proxy_send_timeout 30s;

            # Timeouts for document upload endpoint.
            proxy_request_buffering off;
        }

        # Swagger UI (served by API itself via /static).
        location /docs {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://api:8000;
        }

        location /openapi.json {
            proxy_pass http://api:8000;
        }

        location /static/ {
            proxy_pass http://api:8000;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # Block everything else.
        location / {
            return 404;
        }
    }
}
